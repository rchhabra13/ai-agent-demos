[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-trial-matchmaker"
version = "0.1.0"
description = "An MCP server that matches patients to clinical trials using FHIR data and LLM reasoning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Rishi Chhabra", email = "rishi.chhabra@outlook.com" }]
keywords = ["mcp", "healthcare", "fhir", "clinical-trials", "ai", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
  "mcp[cli]>=1.6.0",
  "anthropic>=0.49.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "structlog>=24.2.0",
  "tenacity>=8.3.0",
  "python-dateutil>=2.9.0",
  "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "respx>=0.21.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
]

[project.scripts]
trial-matchmaker = "clinical_trial_matchmaker.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_trial_matchmaker"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "RET", "SIM", "TCH"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=clinical_trial_matchmaker --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/scripts/*"]
